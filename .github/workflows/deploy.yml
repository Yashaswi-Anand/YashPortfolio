name: Deploy to Hostinger

# Builds the React app and uploads the compiled output to the
# anandyash.socialriser.com document root over FTPS.
#
# All site-specific values live in GitHub repository secrets, which you set
# yourself under: Settings > Secrets and variables > Actions.
#   FTP_SERVER      - hostname or IP from hPanel (no ftp://, no port, no slash)
#   FTP_USERNAME    - full FTP username, e.g. u123456789.deploy
#   FTP_PASSWORD    - that FTP account's password
#   FTP_SERVER_DIR  - remote document root WITH a trailing slash,
#                     e.g. /domains/anandyash.socialriser.com/public_html/

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys write to the same directory at once.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and upload over FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Matches the local Node version, so "builds on my machine" holds in CI.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # react-scripts 5 turns every ESLint warning into a FATAL build error
          # whenever CI is a truthy string, and GitHub Actions sets CI=true on
          # every runner. Without this override a single unused import breaks
          # the deploy. The value must be the literal lowercase string "false".
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'

      - name: Verify build output
        run: |
          test -f build/index.html || { echo "::error::build/index.html is missing"; exit 1; }
          if [ ! -f build/.htaccess ]; then
            echo "::error::build/.htaccess is missing — SPA routing, HTTPS redirect and cache headers would all be lost"
            exit 1
          fi
          echo "Build output:"
          ls -la build/

      - name: Upload to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

          # Trailing slash is required — without it uploads land one level off.
          local-dir: ./build/

          # Explicit FTPS: same port 21 and same credentials as plain FTP, but
          # upgrades to TLS via AUTH TLS so the password is not sent in clear.
          protocol: ftps
          port: 21

          # Shared hosts often present a certificate that does not match the
          # bare hostname/IP; "strict" would reject it and fail the deploy.
          security: loose

          # Set to true to preview which remote paths WOULD be written, without
          # uploading anything. Recommended for the very first run so you can
          # confirm FTP_SERVER_DIR points at the right directory.
          dry-run: false
